# Owner: Digant
# Status: in progress
services:
  - type: web
    name: dispute-helper-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dispute-helper-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_MODE
        value: "false"
      - key: DEMO_MERCHANT_PASSWORD
        sync: false
      - key: DEMO_INDIVIDUAL_PASSWORD
        sync: false
      - key: PAYPAL_REPORT_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CARRIER_API_BASE_URL
        sync: false
      - key: ELASTIC_URL
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: WORKERS_ENABLED
        value: "false"
      - key: WORKERS_INTERVAL_SECONDS
        value: "300"

  # The staff console as a static site. For the demo it runs on the sample data
  # built into the frontend, so it works without the API above. Static sites
  # don't sleep on the free plan.
  - type: web
    name: guard-pay-console
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_USE_MOCK
        value: "true"
    routes:
      # Single-page app: let React Router handle /queue, /cases/... on refresh
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dispute-helper-db
    plan: free
    databaseName: dispute_helper
    user: dispute_helper
